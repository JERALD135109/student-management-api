<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student records</title>
<style>
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #18212B;
    --muted: #5A6573;
    --line: #DDE2E9;
    --accent: #2B4C7E;
    --danger: #B3261E;
    --ok: #1E7B4A;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 40px auto;
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
  h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
  #count { color: var(--muted); font-size: 15px; }
  section { padding-top: 24px; margin-top: 24px; border-top: 1px solid var(--line); }

  .auth-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
  #authState { margin: 12px 0 0; font-size: 14px; color: var(--muted); }

  form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .field label { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600; }
  .field input {
    width: 100%;
    padding: 9px 11px;
    font: inherit;
    color: inherit;
    border: 1px solid #B8C0CB;
    border-radius: 6px;
    background: #fff;
  }
  .field input.invalid { border-color: var(--danger); }
  .field-error { min-height: 1.25em; margin: 4px 0 0; font-size: 14px; color: var(--danger); }
  .actions { grid-column: 1 / -1; display: flex; gap: 12px; }

  button { font: inherit; cursor: pointer; }
  button.primary {
    padding: 9px 18px;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-weight: 600;
  }
  button.secondary {
    padding: 9px 18px;
    color: var(--ink);
    background: #fff;
    border: 1px solid #B8C0CB;
    border-radius: 6px;
  }
  button.text-btn { padding: 4px 6px; background: none; border: 0; font-size: 15px; }
  button.edit { color: var(--accent); }
  button.delete { color: var(--danger); }
  button.text-btn:hover { text-decoration: underline; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .msg { min-height: 1.5em; margin: 14px 0 0; font-size: 15px; }
  .msg.ok { color: var(--ok); }
  .msg.error { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 14px; font-weight: 600; color: var(--muted); }
  td.row-actions { text-align: right; white-space: nowrap; }
  #empty { margin: 16px 0 0; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 560px) {
    main { margin: 0; border-radius: 0; border-left: 0; border-right: 0; padding: 20px; }
    form, .auth-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Student records</h1>
    <span id="count"></span>
  </header>

  <section aria-labelledby="authTitle">
    <h2 id="authTitle">Sign in to make changes</h2>
    <div class="auth-row">
      <div class="field">
        <label for="loginUser">Username</label>
        <input id="loginUser" autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" autocomplete="current-password">
      </div>
      <div>
        <button type="button" class="secondary" id="signInBtn">Sign in</button>
        <button type="button" class="secondary" id="signOutBtn" hidden>Sign out</button>
      </div>
    </div>
    <p id="authState"></p>
  </section>

  <section aria-labelledby="formTitle">
    <h2 id="formTitle">Add student</h2>
    <form id="studentForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" autocomplete="off">
        <p class="field-error" id="nameError"></p>
      </div>
      <div class="field">
        <label for="department">Department</label>
        <input id="department" autocomplete="off">
        <p class="field-error" id="departmentError"></p>
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="submitBtn">Add student</button>
        <button type="button" class="secondary" id="cancelBtn" hidden>Cancel</button>
      </div>
    </form>
    <p id="message" class="msg" role="status" aria-live="polite"></p>
  </section>

  <section aria-label="Students">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Department</th>
          <th><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" hidden>No students yet. Add the first one above.</p>
  </section>
</main>

<script>
  const API = 'http://localhost:8080/students';

  const form = document.getElementById('studentForm');
  const nameInput = document.getElementById('name');
  const deptInput = document.getElementById('department');
  const submitBtn = document.getElementById('submitBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const formTitle = document.getElementById('formTitle');
  const message = document.getElementById('message');
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const signInBtn = document.getElementById('signInBtn');
  const signOutBtn = document.getElementById('signOutBtn');
  const authState = document.getElementById('authState');

  let editingId = null;
  // Credentials live only in memory: they are lost on page refresh (on purpose).
  let authHeader = null;
  let currentUser = null;

  function toBase64(text) {
    return btoa(unescape(encodeURIComponent(text)));
  }

  function setAuthState() {
    if (authHeader) {
      authState.textContent = 'Signed in as ' + currentUser + '. Changes are checked when you save.';
      signOutBtn.hidden = false;
    } else {
      authState.textContent = 'Not signed in. Anyone can view the list, but add, edit and delete need sign-in.';
      signOutBtn.hidden = true;
    }
  }

  function signIn() {
    const user = loginUser.value.trim();
    const pass = loginPass.value;
    if (!user || !pass) {
      showMessage('Enter both username and password.', 'error');
      return;
    }
    authHeader = 'Basic ' + toBase64(user + ':' + pass);
    currentUser = user;
    loginPass.value = '';
    setAuthState();
    showMessage('Signed in. Your login is checked the first time you save.', 'ok');
  }

  function signOut() {
    authHeader = null;
    currentUser = null;
    setAuthState();
    showMessage('Signed out.', 'ok');
  }

  function handleAuthFailure() {
    authHeader = null;
    currentUser = null;
    setAuthState();
    showMessage('Wrong username or password (or not signed in). Sign in again and retry.', 'error');
  }

  function showMessage(text, kind) {
    message.textContent = text || '';
    message.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function clearFieldErrors() {
    ['name', 'department'].forEach(function (key) {
      document.getElementById(key + 'Error').textContent = '';
      document.getElementById(key).classList.remove('invalid');
    });
  }

  function showFieldErrors(errors) {
    Object.keys(errors).forEach(function (key) {
      const errorEl = document.getElementById(key + 'Error');
      const inputEl = document.getElementById(key);
      if (errorEl) { errorEl.textContent = errors[key]; }
      if (inputEl) { inputEl.classList.add('invalid'); }
    });
  }

  // Credentials are attached only to non-GET requests. Reading is public, and sending
  // a wrong Authorization header with a GET would be rejected even though GET is open.
  async function request(url, options) {
    const opts = Object.assign({}, options || {});
    const method = (opts.method || 'GET').toUpperCase();
    const headers = Object.assign({}, opts.headers || {});
    if (authHeader && method !== 'GET') {
      headers['Authorization'] = authHeader;
    }
    opts.headers = headers;
    const res = await fetch(url, opts);
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    return { ok: res.ok, status: res.status, data: data };
  }

  function serverDown() {
    showMessage('Cannot reach the server at ' + API + '. Check that the backend is running.', 'error');
  }

  function resetForm() {
    editingId = null;
    form.reset();
    clearFieldErrors();
    formTitle.textContent = 'Add student';
    submitBtn.textContent = 'Add student';
    cancelBtn.hidden = true;
  }

  function startEdit(student) {
    if (!authHeader) {
      showMessage('Sign in first to edit a student.', 'error');
      loginUser.focus();
      return;
    }
    editingId = student.id;
    nameInput.value = student.name || '';
    deptInput.value = student.department || '';
    clearFieldErrors();
    showMessage('');
    formTitle.textContent = 'Edit student';
    submitBtn.textContent = 'Save changes';
    cancelBtn.hidden = false;
    nameInput.focus();
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function renderRows(students) {
    rows.textContent = '';
    students.forEach(function (s) {
      const tr = document.createElement('tr');

      const nameTd = document.createElement('td');
      nameTd.textContent = s.name || '';
      const deptTd = document.createElement('td');
      deptTd.textContent = s.department || '';

      const actionsTd = document.createElement('td');
      actionsTd.className = 'row-actions';

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'text-btn edit';
      editBtn.textContent = 'Edit';
      editBtn.setAttribute('aria-label', 'Edit ' + (s.name || 'student'));
      editBtn.addEventListener('click', function () { startEdit(s); });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'text-btn delete';
      delBtn.textContent = 'Delete';
      delBtn.setAttribute('aria-label', 'Delete ' + (s.name || 'student'));
      delBtn.addEventListener('click', function () { deleteStudent(s); });

      actionsTd.appendChild(editBtn);
      actionsTd.appendChild(delBtn);
      tr.appendChild(nameTd);
      tr.appendChild(deptTd);
      tr.appendChild(actionsTd);
      rows.appendChild(tr);
    });

    empty.hidden = students.length > 0;
    count.textContent = students.length === 1 ? '1 student' : students.length + ' students';
  }

  async function loadStudents() {
    try {
      const res = await request(API);
      if (res.ok && Array.isArray(res.data)) {
        renderRows(res.data);
      } else {
        showMessage('Could not load students (status ' + res.status + ').', 'error');
      }
    } catch (err) {
      serverDown();
    }
  }

  async function deleteStudent(student) {
    if (!authHeader) {
      showMessage('Sign in first to delete a student.', 'error');
      loginUser.focus();
      return;
    }
    if (!confirm('Delete ' + (student.name || 'this student') + '? This cannot be undone.')) { return; }
    try {
      const res = await request(API + '/' + student.id, { method: 'DELETE' });
      if (res.status === 401) { handleAuthFailure(); return; }
      if (res.ok) {
        if (editingId === student.id) { resetForm(); }
        showMessage('Deleted ' + (student.name || 'student') + '.', 'ok');
        await loadStudents();
      } else {
        showMessage((res.data && res.data.error) || 'Could not delete (status ' + res.status + ').', 'error');
      }
    } catch (err) {
      serverDown();
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearFieldErrors();
    showMessage('');

    if (!authHeader) {
      showMessage('Sign in first to add or edit a student.', 'error');
      loginUser.focus();
      return;
    }

    const isEdit = editingId !== null;
    const body = JSON.stringify({
      name: nameInput.value.trim(),
      department: deptInput.value.trim()
    });

    try {
      const res = await request(isEdit ? API + '/' + editingId : API, {
        method: isEdit ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body
      });

      if (res.status === 401) {
        handleAuthFailure();
      } else if (res.ok) {
        resetForm();
        showMessage(isEdit ? 'Changes saved.' : 'Student added.', 'ok');
        await loadStudents();
      } else if (res.status === 400 && res.data && typeof res.data === 'object') {
        showFieldErrors(res.data);
        showMessage('Fix the highlighted fields and try again.', 'error');
      } else {
        showMessage((res.data && res.data.error) || 'Something went wrong (status ' + res.status + ').', 'error');
      }
    } catch (err) {
      serverDown();
    }
  });

  cancelBtn.addEventListener('click', function () {
    resetForm();
    showMessage('');
  });

  signInBtn.addEventListener('click', signIn);
  signOutBtn.addEventListener('click', signOut);
  loginPass.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { signIn(); }
  });

  setAuthState();
  loadStudents();
</script>
</body>
</html>
